<!doctype html>
<!-- dapp-rpc-fixture — the E2E proof page for the NATIVE dApp browser.
     Loaded inside the BearDappBrowser WebView (served over http://10.0.2.2:8080
     from the CI host; https://localhost would face Capacitor's local-server
     certificate in a second WebView). It exercises the real chain a dApp
     uses: injected provider → eth_chainId → eth_requestAccounts (the wallet
     asks the user) → eth_accounts, and writes each answer into #out, which
     the E2E driver reads over CDP from this page's own target.
     A plain browser without the Bear bridge must land on error=… lines,
     never hang: every request is raced against a deadline. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bear-rpc-fixture</title>
<style>body{font:14px monospace;background:#101018;color:#d8d8ff;margin:0;padding:12px}pre{white-space:pre-wrap}</style>
</head>
<body>
<h1 id="title">bear-rpc-fixture</h1>
<pre id="out">pending</pre>
<script>
(function () {
  var lines = [];
  var out = document.getElementById('out');
  function rec(k, v) {
    lines.push(k + '=' + (typeof v === 'object' ? JSON.stringify(v) : String(v)));
    out.textContent = lines.join('\n');
  }
  function deadline(ms, label) {
    return new Promise(function (_, rej) {
      setTimeout(function () { rej(new Error(label + ' timeout ' + ms + 'ms')); }, ms);
    });
  }
  rec('hasProvider', !!(window.ethereum && window.ethereum.isBear));
  // The provider injection races THIS parser (runs 38047794274/38056613084:
  // all three native hooks logged landing=true while the parse-time
  // window.ethereum read came up empty — a local page parses in ~0ms and
  // beats every queued evaluateJavascript). Real dApps tolerate late wallets
  // (EIP-6963 announce / ethereum#initialized); so does this fixture: wait
  // up to 3s and RECORD the lateness — providerLate=0 = injection won the
  // race, N = the parser did. The chain inside main() only runs once
  // window.ethereum exists, so a lost race delays; it never lies.
  function main() {
  // E2E truth probes — runs 38040858378/38046569239: the Java side logged
  // resolve#1->"resolved" while this page's own deadline still screamed
  // timeout, with no exception anywhere. Someone is lying; these two facts
  // say who. __pageResolve = the instance THIS page registered its pending
  // promise in (Java echoes window.__pageResolve === window.__bearNativeResolve
  // on its side of the hop). __bearE2EProbe settles a promise BY THE PAGE
  // ITSELF, no native involved: machinery (then-chain works) vs transport
  // (the native hop) — decoupled at last.
  window.__pageResolve = window.__bearNativeResolve;
  window.__bearE2EProbe = function () {
    var head = {
      sameFn: window.__pageResolve === window.__bearNativeResolve,
      type: typeof window.__bearNativeResolve,
    };
    try {
      var pr = window.ethereum.request({ method: 'eth_chainId' }); // id=2
      // page settles ITSELF synchronously — the native answer arriving later
      // hits a deleted pending entry ('unknown-id', bounded, harmless)
      window.__bearNativeResolve(2, { result: '0xAB' });
      window.__probeSelf = pr.then(
        function (r) { return 'settled:' + r; },
        function (e) { return 'rejected:' + (e && e.message ? e.message : String(e)); }
      );
    } catch (e) {
      window.__probeSelf = Promise.resolve('threw:' + e.message);
    }
    return head;
  };
  // The last open link: Java logged resolve#1->"resolved" (p.resolve called
  // on THIS page's instance) while Promise.all timed out. __id1 tracks the
  // exact promise Promise.all waits on — settled+value proves the outer
  // promise followed the inner resolve; still-false at timeout isolates the
  // break between inner and outer.
  var p1 = window.ethereum.request({ method: 'eth_chainId' });
  window.__id1 = { settled: false, value: null };
  p1.then(function (v) { window.__id1.settled = true; window.__id1.value = String(v); },
           function (e) { window.__id1.settled = 'rejected'; window.__id1.value = String(e && e.message); });
  Promise.all([
    p1,
    deadline(30000, 'eth_chainId'),
  ]).then(function (r) {
    rec('chainId', r[0]);
    return Promise.all([
      window.ethereum.request({ method: 'eth_requestAccounts' }),
      deadline(60000, 'eth_requestAccounts'),
    ]);
  }).then(function (r) {
    rec('account0', ((r[0] || [])[0] || '').toLowerCase());
    return Promise.all([
      window.ethereum.request({ method: 'eth_accounts' }),
      deadline(15000, 'eth_accounts'),
    ]);
  }).then(function (r) {
    rec('accountsAgain', ((r[0] || [])[0] || '').toLowerCase());
    rec('done', 'ok');
  }).catch(function (e) {
    rec('error', e && e.message ? e.message : String(e));
    rec('done', 'failed');
  });
  }
  var waited = 0;
  (function poll() {
    if (window.ethereum && window.ethereum.isBear) {
      rec('providerLate', waited);
      main();
      return;
    }
    if (waited >= 3000) { rec('error', 'no window.ethereum'); rec('done', 'failed'); return; }
    waited += 50;
    setTimeout(poll, 50);
  })();
})();
</script>
</body>
</html>
