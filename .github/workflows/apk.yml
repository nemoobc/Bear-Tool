name: Android APK

# Build the Capacitor Android app — min/target SDK 33 (Android 13), compile 36.
# Icon/splash rasterization runs here because sharp has no Termux prebuilt.
# Lessons applied from the previous project: setup-android@v4 (v3 dies on the
# removed sdkmanager "tools" package), JDK 21 (Capacitor 8).
#
# www/ MUST be the built bundle (dist/): index.html boots
# <script type="module"> from the Vite build — copying the raw source tree
# without src/ (the old way) shipped an APK whose only script 404'd and
# rendered a blank app.

# Push trigger DIHAPUS (user 2026-10-05: "apk jangan trigger") — build APK
# boros runner tiap push tanpa nilai. Jalankan manual via workflow_dispatch.
on:
  workflow_dispatch:

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22' # Capacitor 8 CLI requires Node >= 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Install platform android-36 + build-tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Rasterize bear assets (icon + splash)
        run: node tools/make-assets.mjs

      - name: Generate Android res from assets
        run: npx @capacitor/assets generate --android --assetPath resources --iconBackgroundColor '#1a1a2e' --splashBackgroundColor '#1a1a2e'

      - name: Build web bundle (dist/)
        run: npm run build
        env:
          # Baked into the bundle so a device screenshot names its own build
          # (js/native-dapp.js diag toast shows build <sha>).
          VITE_BUILD_SHA: ${{ github.sha }}

      - name: Build www/ from dist and sync to the Android project
        run: |
          rm -rf www
          mkdir -p www
          cp -r dist/. www/
          npx cap sync android

      # ── pinned signing key ────────────────────────────────────────
      # secrets present  → decode the repo key; signature stable forever.
      # secrets missing  → ONE-TIME bootstrap: mint the key with keytool,
      # sign the APK with it, and ship key+pass out via artifacts so the
      # maintainer promotes them into repo secrets (next run decodes them).
      # Either way gradle gets ANDROID_KEYSTORE_PATH/PASS/ALIAS.
      - name: Keystore (decode from secrets, or first-run bootstrap)
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/bear.p12"
            KEY_PASS_VAL="$ANDROID_KEYSTORE_PASS"
          else
            KEY_PASS_VAL="$(openssl rand -hex 16)"
            keytool -genkeypair -storetype PKCS12 -keyalg RSA -keysize 2048 \
              -validity 10950 -alias bear \
              -dname "CN=Bear Tool, OU=BearTool, O=nemoobc, C=ID" \
              -keystore "$RUNNER_TEMP/bear.p12" -storepass "$KEY_PASS_VAL" -keypass "$KEY_PASS_VAL"
            cp "$RUNNER_TEMP/bear.p12" bear-keystore.p12
            # The pass must reach the maintainer ONCE so it can become a
            # secret; it never appears in the console log.
            printf '%s' "$KEY_PASS_VAL" > bootstrap-keystore-pass.txt
            echo "BOOTSTRAP=true" >> "$GITHUB_ENV"
          fi
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/bear.p12" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_ALIAS=bear" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASS=$KEY_PASS_VAL" >> "$GITHUB_ENV"
          # Fingerprint = the identity users can hold us to. Printed every
          # build; it must never change between releases.
          keytool -list -v -keystore "$RUNNER_TEMP/bear.p12" -storepass "$KEY_PASS_VAL" -alias bear \
            | sed -n 's/.*SHA256: \(.*\)/  key SHA256 = \1/p'

      - name: Upload keystore bootstrap artifacts (one-time)
        if: ${{ env.BOOTSTRAP == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: bear-keystore-bootstrap
          path: |
            bear-keystore.p12
            bootstrap-keystore-pass.txt
          retention-days: 7
          if-no-files-found: error

      - name: Gradle assembleDebug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bear-tool-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
