name: Onchain Fork Tests (Anvil)

# Real on-chain transactions against an anvil fork of every network:
# mainnets (Ethereum, BSC, Polygon, Arbitrum, OP, Base) + testnets
# (Sepolia, Amoy, Arbitrum Sepolia, OP Sepolia, Base Sepolia, BSC Testnet).
# Each job forks the network from a public RPC and runs the fork suite:
# deploy ERC-20/721/1155, native + ERC-20 send, swap via verified router,
# approval lifecycle, EIP-7702 delegation (skips honestly if unsupported).

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  fork:
    name: Fork ${{ matrix.network }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        # Branch probe ci/setbalance-probe: single network, runs the setBalance
        # probe instead of the suite. Restore the full list after the probe.
        network: [ethereum]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install foundry (anvil)
        uses: foundry-rs/foundry-toolchain@v1

      - name: Cache solc compiler (~9 MB)
        uses: actions/cache@v4
        with:
          path: /tmp/soljson-0828.js
          key: soljson-0828-v1

      - name: Probe anvil_setBalance — ${{ matrix.network }}
        env:
          FORK_NETWORK: ${{ matrix.network }}
        run: node tools/debug-setbalance.mjs
