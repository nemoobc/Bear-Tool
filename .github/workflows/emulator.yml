name: Android Emulator Diag

# Boot the debug APK on a headless emulator and read the TEMPORARY
# diagnostic line (js/native-dapp.js diagNativeDapp → console.log) out of
# logcat. Purpose: pin the "BearDappBrowser not implemented" root cause on a
# real Android runtime WITHOUT a physical device — the line carries
# build <sha>, Capacitor presence, Plugins.BearDappBrowser, isPluginAvailable
# and a live back() ping.
#
# Local Termux cannot run an AVD (needs x86_64 + /dev/kvm) — CI ubuntu has
# KVM. Manual trigger only (same economy rule as apk.yml: no build on push).
on:
  workflow_dispatch:

jobs:
  emulator:
    name: Boot app on emulator, capture diag
    # PINNED, never -latest: runs 38040231871/38042207486/38042758668/38045063225
    # lost qemu ~10s after the E2E driver connected (defunct, 14GB RAM free, no
    # app FATAL, same code path as the run that survived) — deaths clustered on
    # the 24.04.5 fleet after 09:00Z while 06:43–09:17Z runs lived. A floating
    # image makes every failure a guessing game; 22.04 is a separate pool.
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Install platform android-36 + build-tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Rasterize bear assets (icon + splash)
        run: node tools/make-assets.mjs

      - name: Generate Android res from assets
        run: npx @capacitor/assets generate --android --assetPath resources --iconBackgroundColor '#1a1a2e' --splashBackgroundColor '#1a1a2e'

      - name: Build web bundle (dist/)
        run: npm run build
        env:
          VITE_BUILD_SHA: ${{ github.sha }}

      - name: Build www/ from dist and sync to the Android project
        run: |
          rm -rf www
          mkdir -p www
          cp -r dist/. www/
          npx cap sync android

      - name: Gradle assembleDebug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install APK, boot app, capture logcat + screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          # google_apis -> default (run 38059524261, evidence in logcat):
          # gms.persistent died at +4s of the dapp step and AM killed THE APP
          #   Killing com.nemoobc.beartool (adj 0): depends on provider
          #   com.google.android.gms/.fonts.provider.FontsProvider in dying
          #   proc com.google.android.gms.persistent (adj -10000)
          # The app uses NO GMS/Firebase at runtime (google-services plugin is
          # build-time only; zero firebase/gms refs in js/, java/, manifest) —
          # the bare AOSP image removes that whole collateral-kill class plus
          # the GMS/Google-app background churn that comes with it.
          target: default
          disable-animations: true
          emulator-options: -no-snapshot -no-window -noaudio -no-boot-anim -camera-back none
          # HOW android-emulator-runner EXECUTES THIS (source: script-parser.ts
          # + main.ts @v2, read 2026-10-10): parseScript() SPLITS BY NEWLINE,
          # DROPS `#` comment lines, then runs EVERY line as its OWN
          # `sh -c <line>` process — a non-zero exit on ANY line calls
          # setFailed() and the REST OF THE SCRIPT NEVER RUNS (emulator killed).
          # Consequences, learned by losing runs to each one:
          #   - `set +e` is a no-op: it only affects its own one-line process.
          #   - Variables do NOT persist between lines (E2E_EXIT=0, HEARTBEAT=$!).
          #   - `\\` line continuations become a broken trailing-backslash command.
          #   - Every line must be self-contained AND exit 0 on its own:
          #     guard with `|| echo ..._RC=$?` on the SAME line.
          # One line = one job = self-guarded. No state between lines.
          script: |
            adb logcat -v time > logcat-stream.txt 2>&1 &
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk || echo INSTALL_FAILED_RC=$?
            adb shell am start -n com.nemoobc.beartool/.MainActivity || echo AM_START_FAILED_RC=$?
            sleep 8
            timeout 20 adb logcat -d > logcat-boot.txt || echo LOGCAT_BOOT_RC=$?
            adb devices -l > emulator-devices-boot.txt 2>&1 || true
            df -h > disk-usage.txt 2>&1 || true
            ( for i in $(seq 1 30); do echo "$(date -Is) adb=[$(adb devices 2>/dev/null | tr "\n" " ")qemu=$(pgrep -fc qemu 2>/dev/null) app=$(adb shell pidof com.nemoobc.beartool 2>/dev/null | tr -d "\r") free=[$(free -m 2>/dev/null | awk '/^Mem:/{print "tot="$2" avail="$7}')q=[$(pgrep -af qemu 2>/dev/null | tr "\n" ";" | cut -c1-160)]"; sleep 10; done ) > emulator-heartbeat.txt 2>&1 &
            python3 -u -m http.server 8080 --directory dist > http-server.log 2>&1 &
            # Screen recording for the whole run. The parser runs EVERY line as its
            # own `sh -c`, so the recorder is started here and stopped at the end
            # without any shared state, and both halves are `|| echo` guarded: a
            # device that refuses screenrecord must not fail the run. Fixed path
            # because variables do not survive between lines. --time-limit is the
            # backstop if the SIGINT never lands (then the file is still a valid
            # mp4 and the screenshots remain the primary evidence).
            (adb shell screenrecord --time-limit 2400 --bit-rate 4000000 /sdcard/bear-e2e.mp4 > /dev/null 2>&1 &) || echo SR_START_RC=$?
            # ONE recovery cycle against fleet qemu deaths (10 of 19 runs):
            # classification + relaunch live in the script — one line, no state
            # across the parser's one-process-per-line model.
            timeout 2100 env E2E_OUT=emulator-artifacts bash tools/e2e-recover.sh || echo E2E_FAILED_RC=$?
            cat e2e-stdout.log || true
            echo "=== crash / fatal ==="
            grep -aE "FATAL|AndroidRuntime|Fatal signal|panic" logcat-stream.txt | head -20 || true
            echo "=== last heartbeat ==="
            tail -5 emulator-heartbeat.txt || true
            timeout 30 adb logcat -d > emulator-logcat.txt || echo LOGCAT_FINAL_RC=$?
            adb devices -l > emulator-devices-final.txt 2>&1 || true
            adb shell pkill -INT screenrecord || echo SR_STOP_RC=$?
            sleep 4
            adb pull /sdcard/bear-e2e.mp4 emulator-e2e.mp4 || echo SR_PULL_RC=$?
            timeout 30 adb shell screencap -p /sdcard/emulator-boot.png || echo SCREENCAP_RC=$?
            timeout 30 adb pull /sdcard/emulator-boot.png emulator-boot.png || echo PULL_RC=$?

      - name: Assert the E2E actually passed
        # The runner step above swallows EVERY failure: android-emulator-runner
        # runs one `sh -c <line>` per line and each line is `|| echo ..._RC=$?`
        # guarded, so a dead emulator (fleet qemu death, 3/3 boots) used to end
        # the whole run GREEN with an all-FATAL report inside the artifact —
        # a gate that cannot fail is a false gate. The report is the only
        # verdict; make the job honour it. Missing report = fail too.
        run: |
          node -e "const r=require('./emulator-artifacts/emulator-report.json'); console.log('[gate] pass='+r.pass+' steps='+((r.steps||[]).length)+(r.fatal?(' fatal='+r.fatal):'')); if(r.dapp){console.log('[gate] dapp tabs='+JSON.stringify(r.dapp.tabs||null)+' chainChanged='+(r.dapp.chainChanged||'')+' netAfter='+(r.dapp.netAfter||''))} if(!r.pass){console.error('[gate] E2E did NOT pass'); process.exit(1)}"

      - name: Upload diag artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-diag
          path: |
            logcat-stream.txt
            logcat-boot.txt
            emulator-logcat.txt
            emulator-heartbeat.txt
            emulator-devices-boot.txt
            emulator-devices-final.txt
            disk-usage.txt
            http-server.log
            emulator-boot.png
            emulator-e2e.mp4
            emulator-artifacts/
          # warn, not error: a device that refused screenrecord would otherwise
          # fail the upload of every screenshot with it.
          if-no-files-found: warn
