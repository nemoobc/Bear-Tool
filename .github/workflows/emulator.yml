name: Android Emulator Diag

# Boot the debug APK on a headless emulator and read the TEMPORARY
# diagnostic line (js/native-dapp.js diagNativeDapp → console.log) out of
# logcat. Purpose: pin the "BearDappBrowser not implemented" root cause on a
# real Android runtime WITHOUT a physical device — the line carries
# build <sha>, Capacitor presence, Plugins.BearDappBrowser, isPluginAvailable
# and a live back() ping.
#
# Local Termux cannot run an AVD (needs x86_64 + /dev/kvm) — CI ubuntu has
# KVM. Manual trigger only (same economy rule as apk.yml: no build on push).
on:
  workflow_dispatch:

jobs:
  emulator:
    name: Boot app on emulator, capture diag
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Install platform android-36 + build-tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Rasterize bear assets (icon + splash)
        run: node tools/make-assets.mjs

      - name: Generate Android res from assets
        run: npx @capacitor/assets generate --android --assetPath resources --iconBackgroundColor '#1a1a2e' --splashBackgroundColor '#1a1a2e'

      - name: Build web bundle (dist/)
        run: npm run build
        env:
          VITE_BUILD_SHA: ${{ github.sha }}

      - name: Build www/ from dist and sync to the Android project
        run: |
          rm -rf www
          mkdir -p www
          cp -r dist/. www/
          npx cap sync android

      - name: Gradle assembleDebug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install APK, boot app, capture logcat + screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-snapshot -no-window -noaudio -no-boot-anim -camera-back none
          # HOW android-emulator-runner EXECUTES THIS (source: script-parser.ts
          # + main.ts @v2, read 2026-10-10): parseScript() SPLITS BY NEWLINE,
          # DROPS `#` comment lines, then runs EVERY line as its OWN
          # `sh -c <line>` process — a non-zero exit on ANY line calls
          # setFailed() and the REST OF THE SCRIPT NEVER RUNS (emulator killed).
          # Consequences, learned by losing runs to each one:
          #   - `set +e` is a no-op: it only affects its own one-line process.
          #   - Variables do NOT persist between lines (E2E_EXIT=0, HEARTBEAT=$!).
          #   - `\\` line continuations become a broken trailing-backslash command.
          #   - Every line must be self-contained AND exit 0 on its own:
          #     guard with `|| echo ..._RC=$?` on the SAME line.
          # One line = one job = self-guarded. No state between lines.
          script: |
            adb logcat -v time > logcat-stream.txt 2>&1 &
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk || echo INSTALL_FAILED_RC=$?
            adb shell am start -n com.nemoobc.beartool/.MainActivity || echo AM_START_FAILED_RC=$?
            sleep 8
            timeout 20 adb logcat -d > logcat-boot.txt || echo LOGCAT_BOOT_RC=$?
            adb devices -l > emulator-devices-boot.txt 2>&1 || true
            df -h > disk-usage.txt 2>&1 || true
            ( for i in $(seq 1 30); do echo "$(date -Is) adb=[$(adb devices 2>/dev/null | tr "\n" " ")qemu=$(pgrep -fc qemu 2>/dev/null) app=$(adb shell pidof com.nemoobc.beartool 2>/dev/null | tr -d "\r")"; sleep 10; done ) > emulator-heartbeat.txt 2>&1 &
            python3 -u -m http.server 8080 --directory dist > http-server.log 2>&1 &
            timeout 480 env E2E_OUT=emulator-artifacts node tools/emulator-e2e.mjs > e2e-stdout.log 2>&1 || echo E2E_FAILED_RC=$?
            cat e2e-stdout.log || true
            echo "=== crash / fatal ==="
            grep -aE "FATAL|AndroidRuntime|Fatal signal|panic" logcat-stream.txt | head -20 || true
            echo "=== last heartbeat ==="
            tail -5 emulator-heartbeat.txt || true
            timeout 30 adb logcat -d > emulator-logcat.txt || echo LOGCAT_FINAL_RC=$?
            adb devices -l > emulator-devices-final.txt 2>&1 || true
            timeout 30 adb shell screencap -p /sdcard/emulator-boot.png || echo SCREENCAP_RC=$?
            timeout 30 adb pull /sdcard/emulator-boot.png emulator-boot.png || echo PULL_RC=$?

      - name: Upload diag artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-diag
          path: |
            logcat-stream.txt
            logcat-boot.txt
            emulator-logcat.txt
            emulator-heartbeat.txt
            emulator-devices-boot.txt
            emulator-devices-final.txt
            disk-usage.txt
            http-server.log
            emulator-boot.png
            emulator-artifacts/
          if-no-files-found: error
