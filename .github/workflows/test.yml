name: Bear Tool — Auto Test

on:
  push:
    branches: [master, gh-pages]
  pull_request:
    branches: [master]

jobs:
  unit-tests:
    name: Unit & Regression Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: JS syntax check
        run: |
          for f in js/*.js; do node --check "$f" || exit 1; done
          echo "✓ All JS files parse"

      - name: Run npm test (tests/*.test.js)
        shell: bash
        env:
          BEAR_SOLC: '1'
        run: |
          set -o pipefail
          echo "=== Unit + regression suite ==="
          npm test 2>&1 | tee /tmp/npm-test.log
          # Fail loudly: a gate that does not run is decoration.
          grep -q "fail 0" /tmp/npm-test.log || {
            echo "::error::npm test reported failures"; exit 1; }

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate HTML structure
        run: |
          echo "=== HTML Structure Check ==="
          # Check all sections have matching open/close tags
          SECTIONS_OPEN=$(grep -c '<section' index.html)
          SECTIONS_CLOSE=$(grep -c '</section>' index.html)
          echo "Sections: $SECTIONS_OPEN open, $SECTIONS_CLOSE close"
          [ "$SECTIONS_OPEN" -eq "$SECTIONS_CLOSE" ] || { echo "FAIL: Section tag mismatch"; exit 1; }

          # Check all views have IDs
          VIEWS=$(grep -oP 'id="view-\K[^"]+' index.html | sort)
          echo "Views found: $(echo $VIEWS | tr '\n' ' ')"
          VIEW_COUNT=$(echo "$VIEWS" | wc -l)
          [ "$VIEW_COUNT" -eq 11 ] || { echo "FAIL: Expected 11 views, got $VIEW_COUNT"; exit 1; }

          # Check nav items match views
          NAV_VIEWS=$(grep -oP 'data-view="\K[^"]+' index.html | sort -u)
          echo "Nav views: $(echo $NAV_VIEWS | tr '\n' ' ')"
          
          # Check static IDs exist (skip dynamic modal IDs from wallet.js)
          python3 -c "
          import re, glob
          html = open('index.html').read()
          html_ids = set(re.findall(r'id=\"([^\"]+)\"', html))
          # IDs dynamically generated by wallet.js (modals, forms) — skip these
          dynamic_skip = {
              'pwCancel','confirmYes','confirmTypeInput','confirmNo','pwOk','pwInput',
              'cnRpc','cnType','cnExplorer','clearConfirm','cnSymbol','importSecret',
              'importPw','lockBtn','wImport','createPw2','exportBtn','seedDone',
              'importBtn','unlockPw','cnSave','wCreate','createPw','unlockBtn',
              'clearBtn','cnChainId','cnName','createBtn','addAccBtn','seedConfirm','addNetBtn',
              'tokenSend','tokenReceive','tokenSwap','tokenHistory','tokenPriceChart',
              'netSearchInput','netListMainnet','netListTestnet','chooseSwap','chooseBridge',
              'createName','importName','swapRouterSelect','bridgeRouterSelect',
              'dappsContainer','openSeaPanel','btnCheckWL','btnAcceptTopOffer','openSeaStatus',
              'coinPricePanel'
          }
          missing = []
          for f in ['js/swap.js','js/bridge.js','js/send.js','js/app.js']:
              content = open(f).read()
              refs = set(re.findall(r\"\\$\\(['\\\"]#([^'\\\"]+)['\\\"]\\)\", content))
              for r in refs:
                  if r not in html_ids and r not in dynamic_skip:
                      missing.append(f'{f}: #{r}')
          if missing:
              print('FAIL: Missing static IDs in HTML:')
              for m in missing: print(f'  {m}')
              exit(1)
          else:
              print('All static JS-referenced IDs found in HTML ✓')
          "

      - name: Validate CSS syntax
        run: |
          echo "=== CSS Check ==="
          OPEN=$(grep -o '{' css/cartoon.css | wc -l)
          CLOSE=$(grep -o '}' css/cartoon.css | wc -l)
          echo "Braces: $OPEN open, $CLOSE close"
          [ "$OPEN" -eq "$CLOSE" ] || { echo "FAIL: CSS brace mismatch"; exit 1; }
          
          # Check required classes exist
          for cls in quick-actions swap-card bridge-card send-card mobile-nav skip-link; do
            grep -q "$cls" css/cartoon.css || { echo "FAIL: Missing CSS class: $cls"; exit 1; }
          done
          echo "All required CSS classes found ✓"

      - name: Validate JS syntax
        run: |
          echo "=== JS Syntax Check ==="
          for f in js/*.js; do
            node --check "$f" 2>&1 && echo "$f: OK" || { echo "FAIL: $f syntax error"; exit 1; }
          done
          echo "All JS files valid ✓"

      - name: Check for secrets
        run: |
          echo "=== Secret Scan ==="
          FOUND=0
          for f in js/*.js css/*.css index.html; do
            if grep -qPn '(sk-[a-zA-Z0-9]{20,}|api_key\s*=\s*["\x27][a-zA-Z0-9]{20,}|AKIA[0-9A-Z]{16})' "$f" 2>/dev/null; then
              echo "FAIL: Possible secret in $f"
              grep -Pn '(sk-[a-zA-Z0-9]{20,}|api_key\s*=\s*["\x27][a-zA-Z0-9]{20,}|AKIA[0-9A-Z]{16})' "$f"
              FOUND=1
            fi
          done
          [ "$FOUND" -eq 0 ] && echo "No secrets found ✓"

  playwright-test:
    name: Playwright E2E Test (tracked suite)
    runs-on: ubuntu-latest
    needs: static-analysis
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # tests/e2e/11-onchain-fork.spec.js drives real transactions against an
      # Anvil fork of each network from inside the browser. Without foundry it
      # cannot run at all, and the spec now skips itself with a clear reason
      # rather than timing out for an hour — which would have made this job
      # permanently red. Installing the toolchain here is what turns those 14
      # tests from "skipped" into real coverage.
      - name: Install foundry (anvil)
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run E2E suite (tests/e2e/*.spec.js)
        run: npm run test:e2e -- --reporter=list

  full-audit:
    name: Full Audit (All Features + Onchain)
    runs-on: ubuntu-latest
    needs: static-analysis
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run full audit test
        run: |
          echo "╔══════════════════════════════════════════╗"
          echo "║  Bear Tool — FULL AUDIT                 ║"
          echo "║  Features + Onchain + Logs               ║"
          echo "╚══════════════════════════════════════════╝"
          echo ""
          node --test tests/full-audit.test.mjs 2>&1

      - name: Audit summary
        if: always()
        run: |
          echo ""
          echo "╔══════════════════════════════════════════╗"
          echo "║  AUDIT RESULT                            ║"
          echo "╚══════════════════════════════════════════╝"
          # Count pass/fail from previous step output
          echo "Check job output above for detailed results."
          echo "Each section (File Inventory, HTML, CSS, Null Safety,"
          echo "Features, Onchain RPC x12, Cross-check) should show ✓."
          echo ""
          echo "Networks tested: ETH, BSC, Polygon, Arbitrum, OP, Base"
          echo "                 Sepolia, Amoy, Arb Sepolia, OP Sepolia,"
          echo "                 Base Sepolia, BSC Testnet"
