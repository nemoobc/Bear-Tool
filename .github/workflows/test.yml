  onchain-fork:
    name: Onchain Fork Test (All Networks)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run onchain fork tests (All Networks)
        run: |
          cat > onchain-all.test.mjs << 'TESTEOF'
          import { describe, it } from 'node:test';
          import assert from 'node:assert/strict';

          const NETWORKS = [
            // Mainnets
            { name: 'Ethereum',     chainId: 1,     rpcs: ['https://eth.llamarpc.com', 'https://eth.drpc.org', 'https://cloudflare-eth.com'], minBlock: 19000000 },
            { name: 'BSC',          chainId: 56,    rpcs: ['https://bsc-dataseed.binance.org', 'https://bsc-dataseed1.defibit.io'], minBlock: 30000000 },
            { name: 'Polygon',      chainId: 137,   rpcs: ['https://polygon-bor-rpc.publicnode.com', 'https://1rpc.io/matic', 'https://polygon.llamarpc.com', 'https://polygon.drpc.org'], minBlock: 50000000 },
            { name: 'Arbitrum One', chainId: 42161, rpcs: ['https://arb1.arbitrum.io/rpc', 'https://rpc.ankr.com/arbitrum'], minBlock: 200000000 },
            { name: 'OP Mainnet',   chainId: 10,    rpcs: ['https://mainnet.optimism.io', 'https://rpc.ankr.com/optimism'], minBlock: 100000000 },
            { name: 'Base',         chainId: 8453,  rpcs: ['https://mainnet.base.org', 'https://base.llamarpc.com'], minBlock: 10000000 },
            // Testnets
            { name: 'Sepolia',         chainId: 11155111, rpcs: ['https://rpc.sepolia.org', 'https://sepolia.gateway.tenderly.co'], minBlock: 5000000 },
            { name: 'Polygon Amoy',    chainId: 80002,    rpcs: ['https://rpc.ankr.com/polygon_amoy', 'https://polygon-amoy-rpc.publicnode.com', 'https://rpc-amoy.polygon.technology', 'https://polygon-amoy.drpc.org'], minBlock: 1000000 },
            { name: 'Arbitrum Sepolia', chainId: 421614,   rpcs: ['https://sepolia-rollup.arbitrum.io/rpc'], minBlock: 1000000 },
            { name: 'OP Sepolia',      chainId: 11155420, rpcs: ['https://sepolia.optimism.io'], minBlock: 1000000 },
            { name: 'Base Sepolia',    chainId: 84532,    rpcs: ['https://sepolia.base.org'], minBlock: 1000000 },
            { name: 'BSC Testnet',     chainId: 97,       rpcs: ['https://data-seed-prebsc-1-s1.bnbchain.org:8545'], minBlock: 30000000 },
          ];

          async function rpc(rpcs, method, params = []) {
            for (const url of rpcs) {
              try {
                const controller = new AbortController();
                const t = setTimeout(() => controller.abort(), 15000);
                const r = await fetch(url, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ jsonrpc: '2.0', id: 1, method, params }),
                  signal: controller.signal
                });
                clearTimeout(t);
                const data = await r.json();
                if (data.result !== undefined) return data;
              } catch (e) { continue; }
            }
            throw new Error('All RPCs failed for ' + method);
          }

          for (const net of NETWORKS) {
            describe(`Onchain — ${net.name} (${net.chainId})`, () => {
              it('RPC responds (blockNumber)', { timeout: 60000 }, async () => {
                const res = await rpc(net.rpcs, 'eth_blockNumber');
                assert.ok(res.result, `${net.name}: blockNumber is empty`);
                const blockNum = parseInt(res.result, 16);
                assert.ok(blockNum > net.minBlock, `${net.name}: blockNum ${blockNum} <= minBlock ${net.minBlock}`);
                console.log(`  ✓ ${net.name}: block ${blockNum.toLocaleString()}`);
              });

              it('correct chainId', { timeout: 60000 }, async () => {
                const res = await rpc(net.rpcs, 'eth_chainId');
                const chainId = parseInt(res.result, 16);
                assert.equal(chainId, net.chainId, `${net.name}: chainId ${chainId} !== ${net.chainId}`);
                console.log(`  ✓ ${net.name}: chainId ${chainId}`);
              });

              it('gas price available', { timeout: 60000 }, async () => {
                const res = await rpc(net.rpcs, 'eth_gasPrice');
                const gas = parseInt(res.result, 16);
                assert.ok(gas > 0, `${net.name}: gas price is 0`);
                console.log(`  ✓ ${net.name}: gas ${gas.toLocaleString()}`);
              });
            });
          }
          TESTEOF

          node --test onchain-all.test.mjs 2>&1

