name: Deploy Web (Pages)

# Publish the built web app (pure HTML/CSS/JS bundle in dist/) to GitHub
# Pages. dist/ is gitignored — the artifact is built here, uploaded, and
# deployed; the repo branch is never used as the Pages source (that served
# raw src/main.jsx to the browser and the live app was dead).

on:
  push:
    branches: [master]
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'src/**'
      - 'assets/**'
      - 'public/**'
      - 'vite.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build dist + deploy to Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build dist/ (html + hashed css/js + runtime js/assets)
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
