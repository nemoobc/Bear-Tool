<!DOCTYPE html>
<html lang="en">
<head>
  <!-- SECURITY: X-Frame-Options & friends are enforced by the nginx HTTP response header (add_header X-Frame-Options SAMEORIGIN). Do NOT add them as <meta> tags here: browsers ignore meta XFO and log a console warning. -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bear Tool — The Cartoon Wallet That Means Business</title>
  <meta name="description" content="Bear Tool — self-custody crypto wallet, all EVM networks mainnet & testnet, EIP-7702 suite. 100% client-side.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.ethers.io https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https: blob:; connect-src 'self' https: wss: http://localhost:* http://127.0.0.1:*; font-src 'self' data: https://fonts.gstatic.com; frame-src 'self' https: http://localhost:* http://127.0.0.1:*; child-src 'self' https:; object-src 'none'; base-uri 'none';">
  <!--
    frame-src/child-src exist because the DApps browser frames external sites.
    Without them the policy falls back to `default-src 'self'` and EVERY entry
    in the DApps list is refused — the feature renders a blank frame with only
    a console violation. https: is required because the custom-URL box accepts
    any site; the frame is sandboxed WITHOUT allow-same-origin, so framed pages
    run in an opaque origin and cannot touch this page. Plain http: is allowed
    only for loopback (local development).
  -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="Referrer-Policy" content="no-referrer">
  <link rel="icon" href="assets/bear.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/cartoon.css">
</head>
<body>
  <a href="#app-root" class="skip-link" id="skipLink">Skip to main content</a>
  <div id="app">

    <!-- ═══════════ INTRO / LOGO ANIMATION (5s, 5 phases) ═══════════ -->
    <div id="intro" role="group" aria-label="Bear Tool intro animation">
      <div class="intro-stage" aria-hidden="true">
        <div class="intro-splash"></div>
        <div class="intro-orbit">
          <span class="intro-dot"></span><span class="intro-dot"></span>
          <span class="intro-dot"></span><span class="intro-dot"></span>
        </div>
        <span class="intro-sparkle intro-sparkle-1">✦</span>
        <span class="intro-sparkle intro-sparkle-2">✦</span>
        <span class="intro-sparkle intro-sparkle-3">✦</span>
        <svg class="intro-logo" id="introLogo" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="fur" cx="50%" cy="40%" r="60%">
              <stop offset="0%" stop-color="#FFD97A"/>
              <stop offset="100%" stop-color="#F5A623"/>
            </radialGradient>
            <radialGradient id="belly" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#FFF3D6"/>
              <stop offset="100%" stop-color="#FFE3A8"/>
            </radialGradient>
          </defs>
          <!-- orbit ring -->
          <circle cx="120" cy="120" r="104" fill="none" stroke="#4ECDC4" stroke-width="4" stroke-dasharray="8 10" opacity="0.6"/>
          <!-- orbit dots -->
          <circle cx="120" cy="16" r="9" fill="#FF6B6B" stroke="#2D2A32" stroke-width="3"/>
          <circle cx="224" cy="120" r="9" fill="#06D6A0" stroke="#2D2A32" stroke-width="3"/>
          <circle cx="120" cy="224" r="9" fill="#9B5DE5" stroke="#2D2A32" stroke-width="3"/>
          <circle cx="16" cy="120" r="9" fill="#FFC93C" stroke="#2D2A32" stroke-width="3"/>
          <!-- ears -->
          <circle cx="82" cy="72" r="24" fill="url(#fur)" stroke="#2D2A32" stroke-width="5"/>
          <circle cx="158" cy="72" r="24" fill="url(#fur)" stroke="#2D2A32" stroke-width="5"/>
          <circle cx="82" cy="72" r="11" fill="#FF8A3D"/>
          <circle cx="158" cy="72" r="11" fill="#FF8A3D"/>
          <!-- head -->
          <circle cx="120" cy="118" r="62" fill="url(#fur)" stroke="#2D2A32" stroke-width="6"/>
          <!-- face patch -->
          <ellipse cx="120" cy="134" rx="36" ry="28" fill="url(#belly)" stroke="#2D2A32" stroke-width="3"/>
          <!-- eyes (class="eye" enables blink animation) -->
          <ellipse class="eye" cx="101" cy="112" rx="9" ry="11" fill="#2D2A32"/>
          <ellipse class="eye" cx="139" cy="112" rx="9" ry="11" fill="#2D2A32"/>
          <circle cx="105" cy="108" r="3.5" fill="#fff"/>
          <circle cx="143" cy="108" r="3.5" fill="#fff"/>
          <!-- nose -->
          <ellipse cx="120" cy="126" rx="12" ry="8" fill="#2D2A32"/>
          <!-- mouth -->
          <path d="M110 134 Q120 146 130 134" stroke="#2D2A32" stroke-width="4" fill="none" stroke-linecap="round"/>
          <!-- honey pot -->
          <g transform="translate(120, 172)">
            <rect x="-20" y="-12" width="40" height="26" rx="7" fill="#FFC93C" stroke="#2D2A32" stroke-width="4"/>
            <rect x="-14" y="-18" width="28" height="9" rx="4" fill="#FF8A3D" stroke="#2D2A32" stroke-width="3"/>
            <text x="0" y="5" text-anchor="middle" font-family="Fredoka, sans-serif" font-size="12" font-weight="700" fill="#2D2A32">BT</text>
          </g>
        </svg>
      </div>
      <div class="intro-title" id="introTitle" aria-hidden="true">BEAR TOOL</div>
    </div>

    <!-- ═══════════ TOPBAR ═══════════ -->
    <header class="topbar">
      <div class="topbar-logo" id="btnHome">
        <img src="assets/bear.svg" alt="Bear Tool">
        <h1>Bear Tool</h1>
      </div>
      <div class="topbar-right">
        <span id="delegationBadge" class="delegation-badge" hidden></span>
        <div class="network-pill" id="networkPill" role="button" tabindex="0" title="Switch network">
          <span class="net-logo"></span>
          <span class="label" id="networkName">Ethereum</span>
          <span>▾</span>
        </div>
        <div class="account-pill" id="accountPill" role="button" tabindex="0" title="Accounts">
          <span class="pill-wallet">
            <img class="pill-bear" src="assets/bear.svg" alt="" aria-hidden="true">
            <svg class="wallet-glyph" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
              <rect x="3" y="12" width="26" height="17" rx="4.5" fill="#E8963C" stroke="#2D2A32" stroke-width="2"/>
              <rect x="21.5" y="18" width="7.5" height="7" rx="2.5" fill="#FFD97A" stroke="#2D2A32" stroke-width="2"/>
              <circle cx="25.25" cy="21.5" r="1.3" fill="#2D2A32"/>
            </svg>
          </span>
          <span class="label" id="accountShort">Not connected</span>
        </div>
      </div>
    </header>

    <!-- ═══════════ LAYOUT ═══════════ -->
    <div class="layout">
      <!-- sidebar -->
      <nav class="sidebar" id="sidebar" aria-label="Main navigation">
        <div class="nav-item active" data-view="dashboard" role="button" tabindex="0"><span class="icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span> <span data-i18n="nav.dashboard">Dashboard</span></div>
        <div class="nav-item" data-view="activity" role="button" tabindex="0"><span class="icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></span> <span data-i18n="nav.activity">Activity</span></div>
        <div class="nav-item nav-item-highlight" data-view="swap" role="button" tabindex="0"><span class="icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg></span> <span data-i18n="nav.swap">Swap</span></div>
        <div class="nav-item" data-view="nft" role="button" tabindex="0"><span class="icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></span> <span data-i18n="nav.nft">NFT</span></div>
        <div class="nav-item" data-view="dapps" role="button" tabindex="0"><span class="icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></span> <span data-i18n="nav.dapps">DApps</span></div>
        <div class="nav-divider"></div>
        <div class="nav-item" data-view="deploy" role="button" tabindex="0"><span class="icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg></span> <span data-i18n="nav.deploy">Tools</span></div>
        <div class="nav-item" data-view="discord" role="button" tabindex="0"><span class="icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" stroke="none" aria-hidden="true"><path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.865-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.1 18.058a.082.082 0 0 0 .031.056 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.1 13.1 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .078-.011c3.928 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .079.01c.12.099.246.198.373.292a.077.077 0 0 1-.007.128 12.3 12.3 0 0 1-1.873.891.077.077 0 0 0-.04.107c.36.698.772 1.363 1.225 1.993a.076.076 0 0 0 .084.029 19.84 19.84 0 0 0 6.002-3.03.077.077 0 0 0 .032-.055c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.029zM8.02 15.331c-1.183 0-2.157-1.086-2.157-2.419s.956-2.419 2.157-2.419c1.211 0 2.176 1.095 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.086-2.157-2.419s.955-2.419 2.157-2.419c1.21 0 2.176 1.095 2.156 2.42 0 1.333-.946 2.418-2.156 2.418z"/></svg></span> <span data-i18n="nav.discord">Discord</span></div>
        <div class="nav-divider"></div>
        <div class="nav-item" data-view="settings" role="button" tabindex="0"><span class="icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span> <span data-i18n="nav.settings">Settings</span></div>
      </nav>

      <!-- main -->
      <main class="main" id="app-root" tabindex="-1">
      </main>
    </div><!-- end .layout -->

    <!-- ═══════════ MOBILE BOTTOM NAV (visible ≤768px) ═══════════ -->
    <!-- Built by syncMobileNav() in app.js from the desktop sidebar, so the two
         can never drift again. Do not hand-write items here. -->
    <nav class="mobile-nav" id="mobileNav" aria-label="Mobile navigation"></nav>
  </div>

  <!-- ═══════════ MODAL (generic) ═══════════ -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modalBox" role="dialog" aria-modal="true"></div>
  </div>

  <!-- ═══════════ TOAST ═══════════ -->
  <div id="toast-wrap" aria-live="polite"></div>

  <!-- ═══════════ OFFLINE BANNER ═══════════ -->
  <div class="offline-banner hidden" id="offlineBanner" role="alert">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><line x1="1" y1="1" x2="23" y2="23"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.56 9"/><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
    <span>You're offline. Some features may not work.</span>
  </div>

  <!-- ethers.js v6.17.0 — vendored locally. The SRI below was computed from the
       official npm tarball (ethers-6.17.0.tgz) and cross-checked against the
       jsdelivr build; they are byte-identical. Vendored because this is the one
       hard dependency the whole wallet needs: no ethers == no wallet, so a
       blocked/down CDN was a single point of total failure. -->
  <script src="js/vendor/ethers.umd.min.js"
    integrity="sha384-lApM4ELRuFNT7NgNqnXB2zFWgSDdhVvmnOHov2DPJz/2zuNpZImXBeklFr18ilvi"></script>
  <script>
    // Fallback only if the vendored copy did not execute (e.g. js/vendor/ was
    // stripped from a build). document.write is safe here: this is a classic
    // parser-inserted script, and the app below is type="module" (deferred).
    if (typeof window.ethers === 'undefined') {
      document.write('<scr' + 'ipt src="https://cdn.jsdelivr.net/npm/ethers@6.17.0/dist/ethers.umd.min.js" integrity="sha384-lApM4ELRuFNT7NgNqnXB2zFWgSDdhVvmnOHov2DPJz/2zuNpZImXBeklFr18ilvi" crossorigin="anonymous"><\/scr' + 'ipt>');
    }
  </script>
  <!-- qrcode-generator v1.4.4 (vendored, MIT) — Receive QR code -->
  <script src="js/vendor/qrcode.min.js"></script>
  <!-- app modules -->
  <script type="module" src="src/main.jsx"></script>
</body>
</html>
