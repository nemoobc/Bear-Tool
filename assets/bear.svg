<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Bear Tool mascot — original cartoon bear, drawn from scratch -->
  <defs>
    <radialGradient id="fur" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFD97A"/>
      <stop offset="100%" stop-color="#F5A623"/>
    </radialGradient>
    <radialGradient id="belly" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF3D6"/>
      <stop offset="100%" stop-color="#FFE3A8"/>
    </radialGradient>
    <radialGradient id="nose" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#5A4A42"/>
      <stop offset="100%" stop-color="#2D2A32"/>
    </radialGradient>
  </defs>

  <!-- ears -->
  <circle cx="62" cy="52" r="26" fill="url(#fur)" stroke="#2D2A32" stroke-width="5"/>
  <circle cx="138" cy="52" r="26" fill="url(#fur)" stroke="#2D2A32" stroke-width="5"/>
  <circle cx="62" cy="52" r="12" fill="#FF8A3D"/>
  <circle cx="138" cy="52" r="12" fill="#FF8A3D"/>

  <!-- head -->
  <circle cx="100" cy="100" r="72" fill="url(#fur)" stroke="#2D2A32" stroke-width="6"/>

  <!-- face patch -->
  <ellipse cx="100" cy="118" rx="42" ry="34" fill="url(#belly)" stroke="#2D2A32" stroke-width="3"/>

  <!-- eyes -->
  <ellipse cx="78" cy="92" rx="11" ry="13" fill="#2D2A32"/>
  <ellipse cx="122" cy="92" rx="11" ry="13" fill="#2D2A32"/>
  <circle cx="82" cy="88" r="4" fill="#fff"/>
  <circle cx="126" cy="88" r="4" fill="#fff"/>

  <!-- eyebrows -->
  <path d="M64 76 Q78 68 92 76" stroke="#2D2A32" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M108 76 Q122 68 136 76" stroke="#2D2A32" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- nose -->
  <ellipse cx="100" cy="108" rx="14" ry="10" fill="url(#nose)" stroke="#2D2A32" stroke-width="3"/>
  <!-- mouth -->
  <path d="M88 118 Q100 132 112 118" stroke="#2D2A32" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- smile cheeks -->
  <circle cx="62" cy="112" r="8" fill="#FF8A3D" opacity="0.5"/>
  <circle cx="138" cy="112" r="8" fill="#FF8A3D" opacity="0.5"/>

  <!-- honey pot badge (Bear Tool signature) -->
  <g transform="translate(100, 158)">
    <rect x="-22" y="-14" width="44" height="28" rx="8" fill="#FFC93C" stroke="#2D2A32" stroke-width="4"/>
    <rect x="-16" y="-20" width="32" height="10" rx="5" fill="#FF8A3D" stroke="#2D2A32" stroke-width="3"/>
    <text x="0" y="4" text-anchor="middle" font-family="Fredoka, sans-serif" font-size="14" font-weight="700" fill="#2D2A32">HONEY</text>
  </g>
</svg>